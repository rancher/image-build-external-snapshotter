name: Build
on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read
  security-events: write # upload Sarif results

jobs:
  build-csi-snapshotter:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker with containerd snapshotter
      uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
      with:
        daemon-config: |
          {
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Set the TAG value
      id: get-TAG
      run: |
        TAG=$(make -s log | grep TAG | cut -d '=' -f2)
        BUILD_META=$(make -s log | grep BUILD_META | cut -d '=' -f2)
        echo "TAG=${TAG}${BUILD_META}" >> "$GITHUB_ENV"

    - name: Build csi-snapshotter image
      env:
        TARGET_PLATFORMS: linux/amd64,linux/arm64
      run: make build-image-csi-snapshotter
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: rancher/hardened-csi-snapshotter:${{ env.TAG }}
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        format: 'sarif'
        output: 'trivy-results.sarif'

  build-snapshot-controller:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker with containerd snapshotter
      uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
      with:
        daemon-config: |
          {
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Set the TAG value
      id: get-TAG
      run: |
        TAG=$(make -s log | grep TAG | cut -d '=' -f2)
        BUILD_META=$(make -s log | grep BUILD_META | cut -d '=' -f2)
        echo "TAG=${TAG}${BUILD_META}" >> "$GITHUB_ENV"

    - name: Build snapshot-controller image
      env:
        TARGET_PLATFORMS: linux/amd64,linux/arm64
      run: make build-image-snapshot-controller

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: rancher/hardened-snapshot-controller:${{ env.TAG }}
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        format: 'sarif'
        output: 'trivy-results.sarif'
