version: 2
updates:
  
  # Maintain dependencies for GitHub Actions
  # Grouped and ignores patch updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      action-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    reviewers:
      - "rancher/k3s"